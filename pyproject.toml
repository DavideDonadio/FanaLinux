[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fanalinux"
version = "0.6.0"
description = "Native Linux Control Panel and Telemetry Suite for Fanatec Hardware"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Davide Donadio"}
]
keywords = ["fanatec", "simracing", "linux", "csl-dd", "telemetry", "gtk4", "libadwaita"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "hidapi>=0.14.0",
]

[project.urls]
Homepage = "https://github.com/DavideDonadio/fanalinux"
Repository = "https://github.com/DavideDonadio/fanalinux.git"
Issues = "https://github.com/DavideDonadio/fanalinux/issues"

[project.scripts]
fanalinux = "fanalinux.main:run_app"

[tool.setuptools.packages.find]
where = ["."]
include = ["fanalinux*"]

[tool.setuptools.package-data]
fanalinux = ["ui/*.css", "resources/icons/*", "resources/rims/*", "resources/bases/*"]
