name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (GTK4, Libadwaita & hidapi)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 libadwaita-1-0 libhidapi-dev xvfb

      - name: Install Python Package
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Run Smoke and Unit Tests under Virtual Display
        run: |
          xvfb-run -a python3 -m unittest discover -s tests
