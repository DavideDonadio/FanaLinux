name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies (GTK4, Libadwaita & Headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libadwaita-1-0 \
            libhidapi-dev \
            xvfb

      - name: Install Python Package & Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pycairo PyGObject
          pip install -e .

      - name: Run Smoke and Unit Tests under Virtual Display
        run: |
          xvfb-run -a python3 -m unittest discover -s tests
