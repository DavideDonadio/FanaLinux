name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies (GTK4, Libadwaita & PyGObject)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libadwaita-1-0 \
            libhidapi-dev \
            xvfb

      - name: Set up Environment with System Site-Packages
        run: |
          python3 -m venv --system-site-packages venv
          ./venv/bin/pip install --upgrade pip setuptools wheel
          ./venv/bin/pip install -e .

      - name: Run Smoke and Unit Tests under Virtual Display
        run: |
          xvfb-run -a ./venv/bin/python3 -m unittest discover -s tests
